<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="12" y="12" width="168" height="168" rx="32" fill="url(#bgGrad)"/>
  <!-- Cartera/billetera -->
  <path d="M48 72h96v72H48z" fill="white" opacity="0.15"/>
  <path d="M48 72h96v72H48z" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <!-- Moneda -->
  <circle cx="96" cy="108" r="28" fill="url(#coinGrad)"/>
  <circle cx="96" cy="108" r="24" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <!-- Símbolo € en la moneda -->
  <text x="96" y="114" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#92400e" text-anchor="middle" dominant-baseline="central">€</text>
  <!-- Líneas de registro -->
  <g stroke="white" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="60" y1="160" x2="132" y2="160"/>
    <line x1="60" y1="170" x2="110" y2="170"/>
    <line x1="60" y1="180" x2="120" y2="180"/>
  </g>
</svg>