<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#bgGrad)"/>
  <!-- Cartera/billetera -->
  <path d="M128 192h256v192H128z" fill="white" opacity="0.15"/>
  <path d="M128 192h256v192H128z" fill="none" stroke="white" stroke-width="6" opacity="0.3"/>
  <!-- Moneda -->
  <circle cx="256" cy="288" r="72" fill="url(#coinGrad)"/>
  <circle cx="256" cy="288" r="64" fill="none" stroke="#fff" stroke-width="4" opacity="0.4"/>
  <!-- Símbolo € en la moneda -->
  <text x="256" y="302" font-family="system-ui, sans-serif" font-size="80" font-weight="bold" fill="#92400e" text-anchor="middle" dominant-baseline="central">€</text>
  <!-- Líneas de registro -->
  <g stroke="white" stroke-width="5" opacity="0.25" stroke-linecap="round">
    <line x1="160" y1="420" x2="352" y2="420"/>
    <line x1="160" y1="445" x2="290" y2="445"/>
    <line x1="160" y1="470" x2="320" y2="470"/>
  </g>
</svg>